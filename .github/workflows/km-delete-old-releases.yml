name: Delete old 1.12.0-km releases

# One-off maintenance: BRAT includes pre-releases when it looks for updates,
# so the releases 1.12.0-km.1 to .13 (older version scheme, semver-higher than
# 1.11.8-km.*) must not exist as releases. Deletes the releases only; the git
# tags stay. The release texts are archived in the owner's vault.

on:
  workflow_dispatch:
  push:
    branches: [km/base]
    paths: ['.github/workflows/km-delete-old-releases.yml']

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases 1.12.0-km.*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(seq 1 13); do
            tag="1.12.0-km.$n"
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$REPO" --yes
              echo "deleted release $tag (tag kept)"
            else
              echo "skip $tag (no release)"
            fi
          done

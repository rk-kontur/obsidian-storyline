name: Mark old km releases as pre-release

# One-off maintenance: the releases 1.12.0-km.1 to 1.12.0-km.13 were made
# under an older version scheme. Semver ranks them above 1.11.8-km.*, so BRAT
# would pick them as "latest". Marking them as pre-release makes BRAT skip
# them; releases, tags and assets stay unchanged.

on:
  workflow_dispatch:
  push:
    branches: [km/base]
    paths: ['.github/workflows/km-mark-prerelease.yml']

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Mark 1.12.0-km.* as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(seq 1 13); do
            tag="1.12.0-km.$n"
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$REPO" --prerelease --latest=false
              echo "marked $tag"
            else
              echo "skip $tag (no release)"
            fi
          done
          gh release edit "1.11.8-km.26" --repo "$REPO" --latest
